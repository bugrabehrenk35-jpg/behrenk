<!doctype html><html lang="tr"><meta charset="utf-8"><style>
@font-face{font-family:DS;src:url(../../../fontlar-gecici/DMSerifDisplay.ttf)}
@font-face{font-family:DSi;src:url(../../../fontlar-gecici/DMSerifDisplay-italic.ttf)}
@font-face{font-family:JB;src:url(../../../fontlar-gecici/JetBrainsMono-500.ttf)}
@font-face{font-family:IN;src:url(../../../fontlar-gecici/Inter-400.ttf)}
:root{--kagit:#ECE8E1;--murekkep:#1C1A19;--soluk:#7A746D;--kir:#A8222B}
html,body{margin:0;width:1080px;height:1350px;overflow:hidden;background:var(--kagit)}
.ust{position:absolute;left:60px;right:60px;top:52px;display:flex;justify-content:space-between;font:17px/1 JB;letter-spacing:.18em;color:var(--murekkep)}
.ust i{font-style:normal;color:var(--kir)}
.foto{position:absolute;left:60px;top:60px;width:960px;height:880px;overflow:hidden;background:#ddd}
.foto img{position:absolute;left:-336px;top:-525px;width:1296px}
.soz{position:absolute;left:60px;top:1000px;font:92px/.98 DS;color:var(--murekkep);letter-spacing:-.01em}
.soz em{font-family:DSi;font-style:normal}
.soz b{color:var(--kir);font-weight:normal}
.alt{position:absolute;left:60px;right:60px;bottom:58px;display:flex;justify-content:flex-end;align-items:flex-end}
.not{font:15px/1.7 JB;letter-spacing:.16em;color:var(--soluk)}
.imza{display:flex;align-items:center;gap:22px}
.imza .lg{height:88px}.imza .ay{width:1px;height:80px;background:#b8b1a8}.imza .is{height:84px}
.gren{position:absolute;inset:0;opacity:.22;mix-blend-mode:multiply;pointer-events:none}
</style><body>
<div class="foto"><img src="ataturk2-net.jpg"></div>
<div class="soz">Yokluğuna<br><em>hâlâ alışamadık</em><b>.</b></div>
<div class="alt">
<div class="imza"><img class="lg" src="logo-koyu.png"><span class="ay"></span><img class="is" src="imza-koyu-yeni.png"></div></div>
<svg class="gren" width="1080" height="1350"><filter id="g"><feTurbulence type="fractalNoise" baseFrequency=".9" numOctaves="2" seed="3"/><feColorMatrix type="matrix" values="0 0 0 0 .5 0 0 0 0 .5 0 0 0 0 .5 0 0 0 -1.6 1.3"/></filter><rect width="1080" height="1350" filter="url(#g)"/></svg>
</body></html>
