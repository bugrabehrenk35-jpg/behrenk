<!doctype html><html lang="tr"><meta charset="utf-8"><style>
@font-face{font-family:Ox;font-weight:400;src:url(oxygen-latin-ext-400-normal.woff2);unicode-range:U+0100-0130,U+0132-024F}
@font-face{font-family:Ox;font-weight:400;src:url(oxygen-latin-400-normal.woff2);unicode-range:U+0000-00FF,U+0131,U+2000-206F}
@font-face{font-family:Ox;font-weight:700;src:url(oxygen-latin-ext-700-normal.woff2);unicode-range:U+0100-0130,U+0132-024F}
@font-face{font-family:Ox;font-weight:700;src:url(oxygen-latin-700-normal.woff2);unicode-range:U+0000-00FF,U+0131,U+2000-206F}
@font-face{font-family:JB;src:url(../../fontlar-gecici/JetBrainsMono-700.ttf)}
@font-face{font-family:O5;src:url(../../fontlar-gecici/Oswald-500.ttf)}
:root{--kir:#EC1E27}
html,body{margin:0;width:1080px;height:1350px;overflow:hidden;background:#0A0A0A;color:#fff;font-family:Ox,sans-serif}
.bars{position:absolute;left:0;right:0;top:0;height:760px;display:flex}
.bars i{flex:1;display:block}
.alt-bars{position:absolute;left:0;right:0;top:640px;height:120px;display:flex}
.alt-bars i{flex:1;display:block}
.parazit{position:absolute;left:0;top:0;width:1080px;height:760px;opacity:.28;mix-blend-mode:overlay}
.tarama{position:absolute;left:0;top:0;width:1080px;height:760px;background:repeating-linear-gradient(180deg,rgba(0,0,0,.18) 0 2px,transparent 2px 6px)}
.glitch{position:absolute;left:0;right:0;height:14px;background:rgba(255,255,255,.18);mix-blend-mode:screen}
.kutu{position:absolute;left:250px;top:250px;width:580px;height:230px;background:#0A0A0A;border:4px solid #fff;display:flex;flex-direction:column;align-items:center;justify-content:center}
.kutu .s{font:700 64px/1 JB;letter-spacing:.06em;text-decoration:line-through;text-decoration-color:var(--kir);text-decoration-thickness:8px;color:#8a8a8a}
.kutu .v{margin-top:20px;font:700 34px/1 JB;letter-spacing:.14em;color:var(--kir)}
.szc{position:absolute;left:58px;top:56px;width:150px;filter:grayscale(1) brightness(1.4)}
.canli{position:absolute;right:58px;top:66px;font:700 24px/1 JB;letter-spacing:.12em;display:flex;align-items:center;gap:12px;background:#0A0A0A;padding:12px 18px}
.canli b{width:16px;height:16px;border-radius:50%;background:var(--kir);display:inline-block;box-shadow:0 0 14px var(--kir)}
.alt{position:absolute;left:64px;right:64px;top:820px}
h1{margin:0;font:700 76px/1.12 Ox}
h1 span{color:var(--kir)}
p{margin:26px 0 0;font:400 34px/1.45 Ox;color:#D2D2D2}
.imza{position:absolute;left:64px;bottom:54px;display:flex;align-items:center;gap:22px}
.imza .lg{height:96px}.imza .ay{width:1.5px;height:92px;background:rgba(255,255,255,.4)}
.imza .ad{display:flex;flex-direction:column;align-items:center}.imza .is{height:90px}.imza .un{font:15px/1 O5;letter-spacing:.14em;color:#BDBDBD;margin-top:8px}
.hash{position:absolute;right:64px;bottom:84px;font:700 24px/1 JB;color:var(--kir);letter-spacing:.02em}
</style><body>
<div class="bars"><i style="background:#c0c0c0"></i><i style="background:#9a9a9a"></i><i style="background:#7a7a7a"></i><i style="background:#EC1E27"></i><i style="background:#5a5a5a"></i><i style="background:#3d3d3d"></i><i style="background:#262626"></i></div>
<div class="alt-bars"><i style="background:#1a1a1a"></i><i style="background:#e8e8e8"></i><i style="background:#1a1a1a"></i><i style="background:#8a1015"></i><i style="background:#1a1a1a"></i><i style="background:#555"></i><i style="background:#0f0f0f"></i></div>
<svg class="parazit" width="1080" height="760"><filter id="n"><feTurbulence type="fractalNoise" baseFrequency=".9" numOctaves="2" seed="11"/><feColorMatrix type="saturate" values="0"/></filter><rect width="1080" height="760" filter="url(#n)"/></svg>
<div class="tarama"></div>
<div class="glitch" style="top:170px"></div><div class="glitch" style="top:540px;height:8px"></div>
<img class="szc" src="szc-seffaf.png">
<div class="canli"><b></b>YAYIN DEVAM EDİYOR</div>
<div class="kutu"><div class="s">SİNYAL YOK</div><div class="v">AMA SES VAR</div></div>
<div class="alt"><h1>Sinyali kesebilirsiniz,<br><span>sesimizi asla.</span></h1>
<p>Halk TV’den sonra Sözcü TV. Gençler olarak bir şeyi biliyoruz: Bir kanalı susturduğunuzda, milyonlarca kişi konuşmaya başlar.</p></div>
<div class="imza"><img class="lg" src="logo.png"><span class="ay"></span><div class="ad"><img class="is" src="imza.png"><span class="un">DİDİM GENÇLİK KOLLARI BAŞKANI</span></div></div>
<div class="hash">#SözcüSusturulamaz</div>
</body></html>
