<!doctype html><html lang="tr"><meta charset="utf-8">
<style>
@font-face{font-family:O7;src:url(../../fontlar-gecici/Oswald-700.ttf)}
@font-face{font-family:O5;src:url(../../fontlar-gecici/Oswald-500.ttf)}
:root{--kirmizi:#E3141E}
html,body{margin:0;width:1080px;height:1350px;overflow:hidden}
body{position:relative;color:#fff;background:
 radial-gradient(ellipse 55% 45% at 28% 45%,#F2333A 0%,rgba(242,51,58,0) 70%),
 linear-gradient(180deg,#E3141E 0%,#C80F18 60%,#8E0912 100%)}
.isik{position:absolute;inset:0;background:repeating-linear-gradient(115deg,rgba(255,255,255,0) 0 120px,rgba(255,255,255,.035) 160px,rgba(255,255,255,0) 210px)}
.gren{position:absolute;inset:0;opacity:.14;mix-blend-mode:overlay}
.logo{position:absolute;left:60px;top:52px;height:74px}
.baslik{position:absolute;left:60px;right:60px;top:150px;font:112px/1 O7;letter-spacing:.01em;white-space:nowrap}
.baslik span{color:#FFD9DB}
.kisi{position:absolute;left:-100px;top:290px;width:672px;-webkit-mask:linear-gradient(180deg,#000 0,#000 53%,transparent 60%);filter:drop-shadow(0 30px 40px rgba(60,0,4,.45))}
.sag{position:absolute;left:566px;right:40px;top:318px}
.ad{font:76px/1.08 O7}
.unvan{margin-top:14px;font:30px/1.2 O5;letter-spacing:.06em;color:#FFE3E4}
.bilgi{margin-top:44px}
.satir{border-top:3px solid rgba(255,255,255,.45);padding:20px 0 22px}
.satir small{display:block;font:24px/1 O5;letter-spacing:.2em;color:#FFD0D3;margin-bottom:10px}
.satir b{display:block;font:58px/1.1 O7;font-weight:normal}
.satir i{display:block;font:36px/1.1 O5;font-style:normal;margin-top:4px}
.band{position:absolute;left:0;right:0;bottom:0;height:150px;background:#fff;display:flex;align-items:center;justify-content:center;box-shadow:0 -14px 40px rgba(60,0,4,.3)}
.band div{font:64px/1 O7;color:var(--kirmizi);letter-spacing:.04em}
</style><body>
<div class="isik"></div>
<svg class="gren" width="1080" height="1350"><filter id="g"><feTurbulence type="fractalNoise" baseFrequency=".8" numOctaves="2" seed="5"/><feColorMatrix type="saturate" values="0"/></filter><rect width="1080" height="1350" filter="url(#g)"/></svg>
<img class="logo" src="yp-logo-beyaz.png">
<div class="baslik">MAZBATA TÖRENİ</div>
<img class="kisi" src="dilaver-kesik.png">
<div class="sag">
 <div class="ad">DİLAVER<br>DEMİR</div>
 <div class="unvan">YENİ PARTİ AYDIN İL BAŞKANI</div>
 <div class="bilgi">
  <div class="satir"><small>TARİH</small><b>2 KASIM 2026</b><i>PAZARTESİ</i></div>
  <div class="satir"><small>SAAT</small><b>14.30</b></div>
  <div class="satir"><small>YER</small><b>EFELER İLÇE<br>SEÇİM MÜDÜRLÜĞÜ</b></div>
 </div>
</div>
<div class="band"><div>TÜM HALKIMIZ DAVETLİDİR</div></div>
</body></html>
