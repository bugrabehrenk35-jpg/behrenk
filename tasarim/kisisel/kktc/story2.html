<!doctype html><html lang="tr"><meta charset="utf-8"><style>
@font-face{font-family:O7;src:url(../../fontlar-gecici/Oswald-700.ttf)}
@font-face{font-family:O5;src:url(../../fontlar-gecici/Oswald-500.ttf)}
@font-face{font-family:O3;src:url(../../fontlar-gecici/Oswald-300.ttf)}
@font-face{font-family:PF;src:url(../../fontlar-gecici/PlayfairDisplay-500i.ttf)}
@font-face{font-family:YT;src:url(../../fontlar-gecici/Yellowtail.ttf)}
:root{--kir:#E30A17;--gri:#393536}
html,body{margin:0;width:1080px;height:1920px;overflow:hidden;background:#F7F4EF;color:var(--gri)}
.cerceve{position:absolute;left:60px;right:60px;top:60px;height:930px;overflow:hidden;border-radius:4px;box-shadow:0 20px 50px rgba(0,0,0,.18)}
.cerceve img{position:absolute;left:-560px;top:-40px;height:1030px}
.tarih{position:absolute;left:60px;right:60px;top:1040px;display:flex;justify-content:space-between;font:22px/1 O5;letter-spacing:.32em;color:#8a817a}
.blok{position:absolute;left:60px;right:60px;top:1100px;display:flex;align-items:center;gap:34px}
.n{font:300px/.82 O7;color:var(--kir);letter-spacing:-.02em}
.y{font:46px/1.3 O7;text-transform:uppercase;letter-spacing:.02em}
.y span{display:block;font:30px/1.2 O3;letter-spacing:.06em;margin-top:10px;color:#6b635d}
.soz{position:absolute;left:60px;right:60px;top:1440px;font:44px/1.3 PF;border-left:6px solid var(--kir);padding-left:28px}
.imza{position:absolute;left:0;right:0;bottom:120px;display:flex;justify-content:center;align-items:center;gap:30px}
.lg{display:flex;flex-direction:column;align-items:center}.lg img{height:84px}
.lg span{margin-top:12px;font:21px/1 O7;letter-spacing:.32em;padding-left:.32em;color:var(--kir)}
.ay{width:1.5px;height:96px;background:#c8c0b8}
.ad{display:flex;flex-direction:column;align-items:center}
.g{font:54px/.9 YT}.u{font:48px/1 O7;letter-spacing:.06em;margin-top:4px}.t{font:16px/1 O5;letter-spacing:.14em;color:#7a716a;margin-top:8px}
</style><body>
<div class="cerceve"><img src="bayrak-2x.jpg"></div>
<div class="tarih"><span>15 KASIM 1983</span><span>15 KASIM 2026</span></div>
<div class="blok"><div class="n">43</div><div class="y">Kuzey Kıbrıs<br>Türk Cumhuriyeti<span>kuruluşunun 43. yılı</span></div></div>
<div class="soz">Yavru vatanımızın kuruluş<br>yıl dönümü kutlu olsun.</div>
<div class="imza"><div class="lg"><img src="logo-renkli.png"><span>DİDİM</span></div><span class="ay"></span><div class="ad"><span class="g">Gökhan</span><span class="u">UZMAN</span><span class="t">YENİ PARTİ DİDİM İLÇE BAŞKANI</span></div></div>
</body></html>
