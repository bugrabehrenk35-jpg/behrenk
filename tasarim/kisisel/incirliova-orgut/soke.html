<!doctype html><html lang="tr"><meta charset="utf-8">
<style>
@font-face{font-family:O7;src:url(../../fontlar-gecici/Oswald-700.ttf)}
@font-face{font-family:O6;src:url(../../fontlar-gecici/Oswald-600.ttf)}
@font-face{font-family:M8;src:url(../../fontlar-gecici/Montserrat-800.ttf)}
@font-face{font-family:M7;src:url(../../fontlar-gecici/Montserrat-700.ttf)}
:root{--koyu:#414042;--kirmizi:#ED1C24;--etiket:#F6DFE0}
html,body{margin:0;width:1080px;height:1920px;overflow:hidden}
body{position:relative;background:url(zemin.png) 0 0/1080px 1920px no-repeat}
.m{position:absolute;left:0;width:1080px;text-align:center;white-space:nowrap;line-height:1}

/* Kuşadası şablonundan ölçülen değerler */
.ust{top:var(--t1);font:64px M8;letter-spacing:.025em;padding-left:.025em;color:var(--koyu)}
.sehir{top:var(--t2);font:var(--sehir-boy,150.6px) O7;letter-spacing:1.6px;color:var(--kirmizi)}
.program{top:var(--t3);font:80.2px O6;letter-spacing:.186em;padding-left:.186em;color:var(--koyu)}

.hap{position:absolute;left:50%;top:1494px;height:69px;transform:translateX(-50%);
  background:#fff;border-radius:6px;display:flex;align-items:center;padding:0 40px;
  font:var(--hap-boy,34px) M8;letter-spacing:var(--hap-ls,.2em);color:var(--kirmizi);white-space:nowrap}
.hap span{margin-right:calc(-1*var(--hap-ls,.2em))}

.kutu{position:absolute;box-sizing:border-box;border-radius:16px;
  background:rgba(0,0,0,.18);box-shadow:inset 0 0 0 2px rgba(255,255,255,.16);
  display:flex;align-items:center;gap:25px;padding-left:31px;color:#fff}
.kutu svg{flex:none;width:62px;height:62px}
.kutu small{display:block;font:26px M7;letter-spacing:.114em;color:var(--etiket);margin-bottom:8px}
.kutu b{font:68px/1 O7;font-weight:normal}
.kutu .gun{font:27px M7;letter-spacing:.06em;color:#fff;margin-left:12px}
.kutu b.yer{display:block;font-size:var(--yer-boy,60px);line-height:1.14;white-space:nowrap}
.kutu .sol{display:flex;flex-direction:column;align-items:center;gap:6px;flex:none}
.kutu .sol small{margin:0}
.slogan{position:absolute;left:50%;top:1232px;transform:translateX(-50%) rotate(-4.76deg);
  background:#fff;padding:14px 36px 16px;border-radius:6px;white-space:nowrap;
  box-shadow:0 10px 24px rgba(0,0,0,.28);font:52px/1 O7;letter-spacing:.02em;color:var(--koyu)}
.slogan em{font-style:normal;color:var(--kirmizi)}
</style>
<body style="--t1:var(--T1,280px);--t2:var(--T2,332px);--t3:var(--T3,500px)">

<div class="m ust">ADAY TANITIM TOPLANTISI</div>
<div class="m sehir">SÖKE</div>
<div class="m program">PROGRAMI</div>

<div class="slogan">SÖZ, YETKİ, KARAR <em>ARTIK ÜYELERİMİZİN!</em></div>

<div class="hap"><span>YENİ PARTİ AYDIN İL BAŞKAN ADAYI</span></div>

<div class="kutu" style="left:56px;top:1576px;width:628px;height:126px;padding-left:28px;gap:22px">
  <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <rect x="3" y="4.5" width="18" height="16.5" rx="2.5"/><path d="M3 9.5h18M8 2.5v4M16 2.5v4"/>
    <path d="M7.5 13.5h.01M12 13.5h.01M16.5 13.5h.01M7.5 17h.01M12 17h.01"/>
  </svg>
  <div style="white-space:nowrap"><small>TARİH</small><b>13 EKİM 2026</b><span class="gun">SALI</span></div>
</div>

<div class="kutu" style="left:700px;top:1576px;width:324px;height:126px;padding-left:28px;gap:22px">
  <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round">
    <circle cx="12" cy="12" r="9.5"/><path d="M12 6.5V12l3.5 2"/>
  </svg>
  <div><small>SAAT</small><b>18:00</b></div>
</div>

<div class="kutu" style="left:56px;top:1714px;width:968px;height:148px;padding-left:30px;gap:26px">
  <div class="sol">
    <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="width:52px;height:58px">
      <path d="M12 21.5s-7-6.2-7-11.8a7 7 0 0 1 14 0c0 5.6-7 11.8-7 11.8z"/><circle cx="12" cy="9.7" r="2.6"/>
    </svg>
    <small>YER</small>
  </div>
  <b class="yer">YENİ PARTİ SÖKE<br>İLÇE BAŞKANLIĞI</b>
</div>
<div class="m" style="top:1878px;font:28.6px M8;letter-spacing:.156em;padding-left:.156em;color:#fff">TÜM HALKIMIZ DAVETLİDİR</div>
</body></html>
