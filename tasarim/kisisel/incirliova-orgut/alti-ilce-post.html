:root{--koyu:#414042;--kirmizi:#ED1C24;--etiket:#F6DFE0}
html,body{margin:0;width:1080px;height:1440px;overflow:hidden}

.panel{position:absolute;inset:0;background:linear-gradient(100deg,#EF343C 0%,#ED1C24 30%,#E31B23 60%,#D5171F 100%);

.m{position:absolute;left:0;width:1080px;text-align:center;white-space:nowrap;line-height:1}
.isim{top:828px;font:92px O7;letter-spacing:2.5px;color:#fff;text-shadow:0 4px 14px rgba(0,0,0,.18)}
.hap{position:absolute;left:50%;top:946px;height:58px;transform:translateX(-50%);background:#fff;border-radius:6px;
  display:flex;align-items:center;padding:0 34px;font:31px M8;letter-spacing:.18em;color:var(--kirmizi);white-space:nowrap}
.hap span{margin-right:-.18em}
.tarih{position:absolute;left:30px;right:30px;top:1014px;height:58px;display:flex;align-items:center;justify-content:center;gap:16px;color:#fff;

.izgara{position:absolute;left:24px;right:24px;top:1084px;display:grid;grid-template-columns:1fr 1fr;gap:9px 12px}
.kart{height:94px;display:flex;align-items:center;gap:12px;padding:0 6px 0 8px;box-sizing:border-box;border-radius:14px;

.kart .saat{flex:none;width:190px;height:80px;border-radius:10px;background:#fff;color:var(--kirmizi);display:flex;align-items:center;justify-content:center;font:72px/1 O7}
.kart .yer{display:flex;flex-direction:column;min-width:0}
.kart b{font:54px/1 O7;font-weight:normal;letter-spacing:.01em;white-space:nowrap}
.kart span{font:27px/1.05 M7;margin-top:4px;white-space:nowrap;color:var(--etiket)}
.slogan{position:absolute;right:26px;top:548px;border-left:7px solid var(--kirmizi);padding:3px 0 5px 18px;white-space:nowrap;font:46px/1.13 O7;color:var(--koyu)}
.slogan{background:#FDFDFD;box-shadow:0 0 14px 10px #FDFDFD}
.slogan em{display:block;font-style:normal;color:var(--kirmizi)}
