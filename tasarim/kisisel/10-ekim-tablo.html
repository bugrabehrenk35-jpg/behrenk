<!doctype html><html lang="tr"><meta charset="utf-8">
<style>
@font-face{font-family:Pano;src:url(../fontlar-gecici/Oswald-500.ttf);font-weight:500}
@font-face{font-family:Pano;src:url(../fontlar-gecici/Oswald-600.ttf);font-weight:600}
@font-face{font-family:Pano;src:url(../fontlar-gecici/Oswald-400.ttf);font-weight:400}
@font-face{font-family:Metin;src:url(../fontlar-gecici/Inter-400.ttf);font-weight:400}
@font-face{font-family:Metin;src:url(../fontlar-gecici/Inter-500.ttf);font-weight:500}

:root{
  --krem:#EFE8DA; --soluk:rgba(239,232,218,.7);
  --amber:#F4B740; --kirmizi:#FF2D2D;
  --karo-ust:#232325; --karo-alt:#1A1A1C;
}
html,body{margin:0;width:1080px;height:var(--h,1440px);overflow:hidden}
body{position:relative;color:var(--krem);font-family:Metin,sans-serif;
  background:linear-gradient(to bottom,#6B0D1C 0%,#4A0913 28%,#22050A 60%,#000 100%)}
body::after{content:"";position:absolute;inset:0;pointer-events:none;
  background:radial-gradient(ellipse 90% 70% at 50% 40%,transparent 55%,rgba(0,0,0,.45))}

.sahne{position:absolute;z-index:1;left:64px;right:64px;top:var(--ust,72px)}

/* üst bilgi şeridi */
.serit{display:flex;justify-content:space-between;align-items:center;
  font:600 26px/1 Pano;letter-spacing:.32em;text-transform:none}
.serit .sol{display:flex;align-items:center;gap:16px}
.serit svg{width:30px;height:30px}
.serit .sag{color:var(--soluk);letter-spacing:.2em}
.cizgi{height:2px;background:rgba(239,232,218,.18);margin:26px 0 0}

/* karo (split-flap) */
.k{position:relative;display:inline-flex;align-items:center;justify-content:center;
  width:var(--w);height:var(--y);border-radius:calc(var(--y)*.08);
  background:linear-gradient(to bottom,var(--karo-ust) 0 50%,var(--karo-alt) 50% 100%);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.07),0 6px 14px rgba(0,0,0,.45);
  font:500 calc(var(--y)*.74)/1 Pano;color:var(--krem);overflow:hidden}
.k::after{content:"";position:absolute;left:0;right:0;top:50%;height:max(2px,calc(var(--y)*.025));
  margin-top:calc(var(--y)*-.0125);background:#050505;box-shadow:0 1px 0 rgba(255,255,255,.05)}
.k::before{content:"";position:absolute;left:0;right:0;top:0;height:50%;
  background:linear-gradient(to bottom,rgba(255,255,255,.04),transparent)}

/* büyük saat */
.saat{display:flex;justify-content:center;align-items:center;gap:14px;margin-top:52px;
  --w:150px;--y:206px}
.saat .k{font-size:170px}
.iki-nokta{display:flex;flex-direction:column;gap:46px;margin:0 8px}
.iki-nokta i{width:22px;height:22px;border-radius:50%;background:var(--kirmizi);}
.saat-not{text-align:center;margin-top:26px;font:400 24px/1 Pano;letter-spacing:.42em;color:var(--soluk);
  padding-left:.42em}

/* pano */
.pano{margin-top:40px;background:#0B0B0C;border-radius:22px;padding:30px 36px 18px;
  box-shadow:0 30px 60px rgba(0,0,0,.55),inset 0 0 0 1px rgba(255,255,255,.06)}
.baslik{display:flex;justify-content:space-between;font:400 21px/1 Pano;letter-spacing:.34em;
  color:rgba(239,232,218,.62);padding-bottom:18px;border-bottom:1px solid rgba(255,255,255,.08)}
.satir{display:flex;justify-content:space-between;align-items:center;padding:18px 0;
  border-bottom:1px solid rgba(255,255,255,.06);--w:56px;--y:80px}
.satir:last-child{border-bottom:0}
.satir .harfler{display:flex;gap:6px}
.durum{text-align:right;font:500 30px/1 Pano;letter-spacing:.1em;color:var(--amber)}
.durum small{display:block;margin-top:10px;font:400 19px/1 Pano;letter-spacing:.24em;color:rgba(244,183,64,.6)}
.durum.gec{color:var(--kirmizi)}
.durum.gec small{color:#FF6B6B}
.durum.gec::before{content:"";display:inline-block;width:12px;height:12px;border-radius:50%;
  background:var(--kirmizi);margin-right:12px;vertical-align:middle;position:relative;top:-3px}

/* alt metin */
.soz{text-align:center;margin-top:var(--soz-ust,40px)}
.soz p{margin:0;font:400 29px/1.45 Metin;color:rgba(239,232,218,.82)}
.soz strong{display:block;margin-top:22px;font:600 36px/1 Pano;letter-spacing:.12em;color:var(--krem);padding-left:.12em}

.imza{position:absolute;z-index:1;left:50%;bottom:var(--imza-alt,56px);width:var(--imza-g,400px);transform:translateX(-50%);opacity:.95}
</style>
<body>
<div class="sahne">
  <div class="serit">
    <div class="sol">
      <svg viewBox="0 0 24 24" fill="none" stroke="#EFE8DA" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <rect x="5" y="3" width="14" height="13" rx="3"/><path d="M5 10h14M9 20l-2 2M15 20l2 2M8.5 13h.01M15.5 13h.01M8 16l-1 4M16 16l1 4"/>
      </svg>
      ANKARA GARI
    </div>
    <div class="sag">10.10.2015</div>
  </div>
  <div class="cizgi"></div>

  <div class="saat">
    <span class="k">1</span><span class="k">0</span>
    <span class="iki-nokta"><i></i><i></i></span>
    <span class="k">0</span><span class="k">4</span>
  </div>
  <div class="saat-not">SAATLER BU DAKİKADA DURDU</div>

  <div class="pano">
    <div class="baslik"><span>SEFER</span><span>DURUM</span></div>
    <!-- her satırda 9 karo; boşlar sabit kalır -->
    <div class="satir"><div class="harfler" data-s="EMEK"></div><div class="durum">BEKLENİYOR</div></div>
    <div class="satir"><div class="harfler" data-s="BARIŞ"></div><div class="durum">BEKLENİYOR</div></div>
    <div class="satir"><div class="harfler" data-s="DEMOKRASİ"></div><div class="durum">BEKLENİYOR</div></div>
    <div class="satir"><div class="harfler" data-s="ADALET"></div><div class="durum gec">GECİKMELİ<small>+11 YIL</small></div></div>
  </div>

  <div class="soz">
    <p>Emek, barış ve demokrasi için yola çıkan<br>canlarımızı saygı ve rahmetle anıyoruz.</p>
    <strong>UNUTMADIK, UNUTTURMAYACAĞIZ.</strong>
  </div>
</div>

<img class="imza" src="imza-beyaz.png">

<script>
for (const el of document.querySelectorAll('.harfler')) {
  const s = [...el.dataset.s];
  for (let i = 0; i < 9; i++) {
    const k = document.createElement('span');
    k.className = 'k';
    k.textContent = s[i] || '';
    el.append(k);
  }
}
</script>
</body></html>
