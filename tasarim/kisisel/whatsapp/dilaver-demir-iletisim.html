<!doctype html><html lang="tr"><meta charset="utf-8">
<style>
@font-face{font-family:O7;src:url(../../fontlar-gecici/Oswald-700.ttf)}
@font-face{font-family:M8;src:url(../../fontlar-gecici/Montserrat-800.ttf)}
:root{--kirmizi:#ED1C24}
html,body{margin:0;width:1080px;height:1080px;overflow:hidden}
body{background:radial-gradient(circle at 50% 45%,#fff 0 45%,#F1F1F2 100%);
  display:flex;flex-direction:column;align-items:center;justify-content:center}
.logo{width:590px;display:block;margin-top:-6px}
.ad{margin-top:46px;font:138px/1 O7;color:var(--kirmizi);letter-spacing:.01em;white-space:nowrap}
.cizgi{display:flex;align-items:center;gap:24px;margin-top:30px}
.cizgi i{width:80px;height:4px;background:var(--kirmizi);border-radius:2px}
.cizgi span{font:52px/1 M8;color:var(--kirmizi);letter-spacing:.32em;padding-left:.32em}
</style>
<body>
  <img class="logo" src="yeni-parti-logo.png">
  <div class="ad">DİLAVER DEMİR</div>
  <div class="cizgi"><i></i><span>İLETİŞİM</span><i></i></div>
</body></html>
