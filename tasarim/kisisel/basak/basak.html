<!doctype html><html lang="tr"><meta charset="utf-8">
<style>
@font-face{font-family:O7;src:url(../../fontlar-gecici/Oswald-700.ttf)}
@font-face{font-family:O6;src:url(../../fontlar-gecici/Oswald-600.ttf)}
:root{--krem:#F2DCD4;--cerceve:#F1EDE6;--bordo:#A4312F;--perde:#6B7776}
html,body{margin:0;width:1080px;height:1350px;overflow:hidden}
body{position:relative;background:#050505}
/* perde: dikey kıvrımlar, üstte aydınlık, alta doğru karanlığa iner */
.perde{position:absolute;inset:0;
  background:
   repeating-linear-gradient(90deg,rgba(120,70,60,.07) 0 7px,rgba(255,255,255,.18) 22px,rgba(120,70,60,.05) 40px,rgba(255,255,255,.22) 58px,rgba(120,70,60,.08) 79px,rgba(255,255,255,.12) 96px,rgba(120,70,60,.07) 118px),
   repeating-linear-gradient(90deg,rgba(255,255,255,.10) 0 31px,rgba(120,70,60,.04) 63px,rgba(255,255,255,.08) 95px),
   linear-gradient(180deg,#F6E4DD 0%,#F2DCD4 45%,#EBD0C6 80%,#E2C3B8 100%)}
.perde::after{content:"";position:absolute;inset:0;background:radial-gradient(ellipse 75% 55% at 52% 40%,rgba(255,255,255,.35),transparent 70%)}
.gren{position:absolute;inset:0;opacity:.22;mix-blend-mode:overlay}
.baslik{position:absolute;left:0;right:0;top:30px;text-align:center;white-space:nowrap;font:88px/1 O7;letter-spacing:.01em;color:#6B7776;
  text-shadow:none}
/* polaroid */
.cerceve{position:absolute;left:112px;top:205px;width:868px;height:955px;background:var(--cerceve);
  box-shadow:0 26px 50px rgba(110,60,50,.28),0 2px 0 rgba(255,255,255,.6) inset}
.pencere{position:absolute;left:162px;top:255px;width:768px;height:700px;overflow:hidden;
  box-shadow:inset 0 0 0 1px rgba(0,0,0,.12)}
.pencere .ic{position:absolute;inset:0;background:inherit}
.kisi{position:absolute;width:1206px;height:1352px;filter:contrast(1.04) saturate(1.05)}
.pencere .kisi{left:-51px;top:-144px}
/* yumruk ve kol çerçevenin dışına taşar */
.tasma{position:absolute;left:0;top:0;width:1080px;height:296px;overflow:hidden;pointer-events:none}
.tasma .kisi{left:111px;top:152px}
.golge{position:absolute;left:0;top:0;width:1080px;height:296px;overflow:hidden;filter:blur(10px);opacity:.45}
.golge .kisi{left:123px;top:168px;filter:brightness(0)}
.bant{position:absolute;left:390px;top:146px;width:300px;height:104px;transform:rotate(-1.2deg);
  background:linear-gradient(180deg,rgba(242,234,214,.92),rgba(232,222,198,.9));
  box-shadow:0 2px 6px rgba(0,0,0,.18);
  clip-path:polygon(1% 4%,4% 0,9% 5%,14% 1%,20% 4%,27% 0,33% 3%,40% 0,47% 4%,54% 1%,61% 4%,68% 0,75% 3%,82% 0,89% 4%,95% 1%,100% 5%,99% 96%,95% 100%,89% 96%,82% 100%,75% 97%,68% 100%,61% 96%,54% 100%,47% 96%,40% 100%,33% 97%,27% 100%,20% 96%,14% 100%,9% 95%,4% 100%,0 96%)}
.bant::after{content:"";position:absolute;inset:0;background:repeating-linear-gradient(0deg,rgba(0,0,0,.025) 0 2px,transparent 2px 9px)}
.isim{position:absolute;left:112px;width:868px;top:968px;text-align:center;color:var(--bordo)}
.isim b{display:block;font:104px/1 O7;font-weight:normal;letter-spacing:.005em}
.isim span{display:block;margin-top:10px;font:46px/1 O6;letter-spacing:.02em}
.logo{position:absolute;left:50%;top:1306px;height:112px;transform:translateX(-50%)}
.kisi2{position:absolute;left:-246px;top:-114px;width:1267px;height:1773px;filter:sepia(.14) saturate(1.06) contrast(1.04) brightness(.97)}
.alt{position:absolute;left:0;right:0;top:1186px;height:104px;display:flex;justify-content:center;align-items:center;gap:28px}
.logo2{height:96px}
.alt .ayrac{width:2px;height:84px;background:rgba(243,230,223,.6)}
.alt .imza{height:88px}
.foto{position:absolute;left:-51px;top:-140px;width:905px;height:1246px;filter:contrast(1.03) saturate(1.04)}
.alt .ayrac{background:rgba(107,119,118,.55)!important}
.gren{opacity:.12!important}
</style>
<body>
<div class="perde"></div>
<svg class="gren" width="1080" height="1350"><filter id="g"><feTurbulence type="fractalNoise" baseFrequency=".85" numOctaves="2" seed="3"/><feColorMatrix type="saturate" values="0"/></filter><rect width="1080" height="1350" filter="url(#g)"/></svg>
<div class="baslik">HAYIRLI OLSUN BAŞKANIM</div>
<div class="cerceve"></div>
<div class="pencere"><div class="perde" style="left:-162px;top:-255px;width:1080px;height:1350px"></div><img class="foto" src="basak-kesik.png" style="left:-35px;top:-124px;filter:brightness(0) blur(18px);opacity:.22"><img class="foto" src="basak-kesik.png"></div>
<div class="bant"></div>
<div class="isim"><b>BAŞAK TIKKIN</b><span>DİDİM İLÇE BAŞKAN YARDIMCISI</span></div>
<div class="alt"><img class="logo2" src="logo-petrol.png"><span class="ayrac"></span><img class="imza" src="imza-petrol.png"></div>
</body></html>
