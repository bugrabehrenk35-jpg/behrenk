<!doctype html><html lang="tr"><meta charset="utf-8">
<style>
@font-face{font-family:O7;src:url(../../../fontlar-gecici/Oswald-700.ttf)}
@font-face{font-family:IN;src:url(../../../fontlar-gecici/Inter-400.ttf)}
@font-face{font-family:S;src:url(../../../fontlar-gecici/__FONT__.ttf)}
html,body{margin:0;width:1778px;height:512px;overflow:hidden;background:__ZEMIN__}
.logo{position:absolute;left:0;top:0;width:800px;height:512px;__LOGOGOR__}
.blok{position:absolute;left:960px;width:815px;top:0;height:512px}
.soyad{position:absolute;left:0;top:__SY__px;font:__SPX__px/1 O7;white-space:nowrap;color:#E0202B;letter-spacing:.005em;transform-origin:left top}
.ad{position:absolute;left:__ADX__px;top:__ADY__px;font:__ADPX__px/1 S;color:#3A3A3C;transform:rotate(-6deg);
  -webkit-text-stroke:12px __HALE__;paint-order:stroke fill;white-space:nowrap}
.unvan{position:absolute;left:0;top:448px;width:815px;text-align:justify;text-align-last:justify;font:56px/1 IN;color:#3A3A3C;letter-spacing:.005em}
</style>
<body>
<img class="logo" src="yp-logo.png">
<div class="blok">
<div class="soyad">TIKKIN</div>
<div class="ad">Başak</div>
<div class="unvan">Didim İlçe Başkan Yardımcısı</div>
</div>
<script>
document.fonts.ready.then(()=>{const e=document.querySelector('.soyad');e.style.transform='scaleX('+(815/e.getBoundingClientRect().width)+')';document.body.dataset.ok=1});
</script></body></html>
