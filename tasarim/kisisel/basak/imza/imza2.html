<!doctype html><html lang="tr"><meta charset="utf-8">
<style>
@font-face{font-family:O7;src:url(../../../fontlar-gecici/Oswald-700.ttf)}
@font-face{font-family:IN;src:url(../../../fontlar-gecici/Inter-400.ttf)}
@font-face{font-family:S;src:url(../../../fontlar-gecici/__FONT__-0.woff2)}
@font-face{font-family:S;src:url(../../../fontlar-gecici/__FONT__-1.woff2);unicode-range:U+0000-00FF}
:root{--murekkep:__MUR__;--kirmizi:__KIR__;--hale:__HALE__}
html,body{margin:0;width:1778px;height:512px;overflow:hidden;background:__ZEMIN__}
.logo{position:absolute;left:0;top:0;width:800px;height:512px}
.blok{position:absolute;left:960px;width:815px;top:0;height:512px}
.soyad{position:absolute;right:__SX__px;top:__SY__px;font:__SPX__px/1 O7;letter-spacing:__SLS__em;color:var(--kirmizi);white-space:nowrap;transform-origin:left top}
.ad{position:absolute;left:__ADX__px;top:__ADY__px;font:__ADPX__px/1 S;transform:rotate(__ROT__deg);transform-origin:left top;white-space:nowrap}
.ad span{position:absolute;left:0;top:0}
.ad .h{color:var(--hale);-webkit-text-stroke:__HW__px var(--hale)}
.ad .m{color:var(--murekkep);-webkit-text-stroke:__KAL__px var(--murekkep)}
.unvan{position:absolute;left:0;top:448px;width:815px;text-align:justify;text-align-last:justify;font:56px/1 IN;color:var(--murekkep)}
</style>
<body>
<img class="logo" src="__LOGO__">
<div class="blok">
<div class="soyad">TIKKIN</div>
<div class="ad"><span class="h">Başak</span><span class="m">Başak</span></div>
<div class="unvan">Didim İlçe Başkan Yardımcısı</div>
</div>
</body></html>
