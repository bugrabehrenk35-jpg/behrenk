<!doctype html><html lang="tr"><meta charset="utf-8">
<style>
@font-face{font-family:O7;src:url(../../../fontlar-gecici/Oswald-700.ttf)}
@font-face{font-family:IN;src:url(../../../fontlar-gecici/Inter-400.ttf)}
@font-face{font-family:S;src:url(../../../fontlar-gecici/Sacramento-0.woff2)}
@font-face{font-family:S;src:url(../../../fontlar-gecici/Sacramento-1.woff2);unicode-range:U+0000-00FF}
:root{--murekkep:#3A3A3C;--kirmizi:#E0202B;--hale:transparent}
html,body{margin:0;width:1778px;height:512px;overflow:hidden;background:transparent}
.logo{position:absolute;left:0;top:0;width:800px;height:512px}
.blok{position:absolute;left:960px;width:815px;top:0;height:512px}
.soyad{position:absolute;right:0px;top:268px;font:162px/1 O7;letter-spacing:.03em;color:var(--kirmizi);white-space:nowrap;transform-origin:left top}
.ad{position:absolute;left:0px;top:66px;font:300px/1 S;transform:rotate(-5deg);transform-origin:left top;white-space:nowrap}
.ad span{position:absolute;left:0;top:0}
.ad .h{color:var(--hale);-webkit-text-stroke:0px var(--hale)}
.ad .m{color:var(--murekkep);-webkit-text-stroke:4.5px var(--murekkep)}
.unvan{position:absolute;left:0;top:448px;width:815px;text-align:justify;text-align-last:justify;font:56px/1 IN;color:var(--murekkep)}
</style>
<body>
<img class="logo" src="yp-logo.png">
<div class="blok">
<div class="soyad">TIKKIN</div>
<div class="ad"><span class="h">Başak</span><span class="m">Başak</span></div>
<div class="unvan">Didim İlçe Başkan Yardımcısı</div>
</div>
</body></html>
