.panel{position:absolute;left:26px;top:26px;right:26px;bottom:26px;border-radius:38px;background:radial-gradient(ellipse 80% 70% at 50% 45%,#F1E9D2 0%,var(--k) 55%,#DDD1B0 100%);overflow:hidden}

.portre{position:absolute;left:40px;top:440px;width:950px;-webkit-mask:linear-gradient(180deg,#000 0,#000 70%,transparent 96%)}
.alt{position:absolute;left:0;right:0;text-align:center;font:44px/1 AR;color:var(--a);letter-spacing:.01em;white-space:nowrap}
.alt small{font-size:26px;vertical-align:4px;margin-right:6px}
.doku{position:absolute;inset:0;mix-blend-mode:multiply;opacity:.55}
.toz{position:absolute;inset:0;mix-blend-mode:screen;opacity:.12}
