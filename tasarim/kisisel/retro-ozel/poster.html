<!doctype html><html lang="tr"><meta charset="utf-8"><style>

/* referans: mor -> antrasit kırmızı, sarı -> antrasit beyaz */
:root{--kr:#6E1A1F;--kr2:#93303A;--kr3:#B4545D;--b:#E6E3DE;--b2:#D3CFC8;--b3:#F2F0EC}
html,body{margin:0;width:1080px;height:1350px;overflow:hidden;background:var(--kr)}
.panel{position:absolute;left:30px;top:30px;right:30px;bottom:30px;border-radius:40px;background:radial-gradient(ellipse 85% 75% at 50% 42%,var(--b3) 0%,var(--b) 55%,var(--b2) 100%);overflow:hidden}
svg.l{position:absolute;left:0;top:0}
.portre{position:absolute;left:-40px;top:392px;width:1100px}
.isim{mix-blend-mode:multiply}
.alt{position:absolute;left:0;right:0;text-align:center;font:50px/1.1 BB;color:var(--kr);letter-spacing:.01em;white-space:nowrap}
.alt small{font-size:28px;vertical-align:10px;margin-right:4px}
.gren{position:absolute;inset:0;mix-blend-mode:multiply;opacity:.35}
</style><body>
<div class="panel">

 </svg>
