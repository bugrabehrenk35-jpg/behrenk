<!doctype html><html lang="tr"><meta charset="utf-8"><style>
@font-face{font-family:Ox;font-weight:400;src:url(oxygen-latin-ext-400-normal.woff2);unicode-range:U+0100-0130,U+0132-024F}
@font-face{font-family:Ox;font-weight:400;src:url(oxygen-latin-400-normal.woff2);unicode-range:U+0000-00FF,U+0131,U+2000-206F}
@font-face{font-family:Ox;font-weight:700;src:url(oxygen-latin-ext-700-normal.woff2);unicode-range:U+0100-0130,U+0132-024F}
@font-face{font-family:Ox;font-weight:700;src:url(oxygen-latin-700-normal.woff2);unicode-range:U+0000-00FF,U+0131,U+2000-206F}
@font-face{font-family:YT;src:url(../../fontlar-gecici/Yellowtail.ttf)}
@font-face{font-family:O7;src:url(../../fontlar-gecici/Oswald-700.ttf)}
@font-face{font-family:O5;src:url(../../fontlar-gecici/Oswald-500.ttf)}
:root{--kir:#EC1E27}
html,body{margin:0;width:1080px;height:1350px;overflow:hidden;background:#0B0B0C;color:#F2F2F2;font-family:Ox,sans-serif}
.parazit{position:absolute;inset:0;opacity:.13}
.tarama{position:absolute;inset:0;background:repeating-linear-gradient(180deg,rgba(255,255,255,.035) 0 2px,transparent 2px 5px)}
.ekran{position:absolute;left:190px;top:110px;width:700px;height:470px;border-radius:26px;background:radial-gradient(ellipse at center,#1d1d20 0,#0f0f11 70%);box-shadow:0 0 0 10px #1a1a1c,0 0 0 12px #2a2a2d,0 40px 80px rgba(0,0,0,.6);overflow:hidden}
.ekran img{position:absolute;left:150px;top:70px;width:400px;filter:grayscale(1) brightness(.8) contrast(1.15)}
.bant{position:absolute;left:-60px;width:820px;height:86px;background:var(--kir);display:flex;align-items:center;justify-content:center;font:700 40px/1 Ox;letter-spacing:.32em;color:#fff;box-shadow:0 8px 24px rgba(0,0,0,.5)}
.b1{top:330px;height:72px;font-size:34px;transform:rotate(-8deg)}
.b2{top:250px;transform:rotate(9deg);background:#1a1a1a;border:3px solid var(--kir);color:var(--kir)}
.ust{position:absolute;left:0;right:0;top:56px;text-align:center;font:700 22px/1 Ox;letter-spacing:.34em;color:#9A9A9A}
h1{position:absolute;left:60px;right:60px;top:640px;margin:0;text-align:center;font:700 80px/1.14 Ox}
h1 span{color:var(--kir)}
.alt{position:absolute;left:70px;right:70px;top:850px;text-align:center;font:400 38px/1.42 Ox;color:#D6D6D6;text-wrap:balance}
.etiket{position:absolute;left:0;right:0;top:1060px;text-align:center;font:700 30px/1 Ox;color:var(--kir);letter-spacing:.06em}
.imza{position:absolute;left:0;right:0;bottom:56px;display:flex;justify-content:center;align-items:center;gap:30px}
.lg{display:flex;flex-direction:column;align-items:center}.lg img{height:82px}.lg span{margin-top:11px;font:20px/1 O7;letter-spacing:.32em;padding-left:.32em;color:#BDBDBD}
.ay{width:1.5px;height:92px;background:rgba(255,255,255,.35)}
.ad{display:flex;flex-direction:column;align-items:center}
.g{font:50px/.9 YT}.u{font:44px/1 O7;letter-spacing:.06em;margin-top:4px}.t{font:15px/1 O5;letter-spacing:.14em;color:#A8A8A8;margin-top:8px}
</style><body>
<svg class="parazit" width="1080" height="1350"><filter id="n"><feTurbulence type="fractalNoise" baseFrequency=".95" numOctaves="2" seed="4"/><feColorMatrix type="saturate" values="0"/></filter><rect width="1080" height="1350" filter="url(#n)"/></svg>
<div class="tarama"></div>
<div class="ust">HALK TV’DEN SONRA SÖZCÜ TV</div>
<div class="ekran"><img src="szc-seffaf.png"><div class="bant b1">KAYYUM</div></div>
<h1>Ekranı karartabilirsiniz,<br><span>gerçeği asla.</span></h1>
<div class="alt">Basına uzanan her el, milletin haber alma hakkına uzanmıştır. Susmayacağız, korkmayacağız, teslim olmayacağız.</div>
<div class="etiket">#SözcüSusturulamaz</div>
<div class="imza"><div class="lg"><img src="logo-beyaz.png"><span>DİDİM</span></div><span class="ay"></span><div class="ad"><span class="g">Gökhan</span><span class="u">UZMAN</span><span class="t">YENİ PARTİ DİDİM İLÇE BAŞKANI</span></div></div>
</body></html>
