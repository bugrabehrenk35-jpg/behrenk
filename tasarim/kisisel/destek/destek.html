<!doctype html><html lang="tr"><meta charset="utf-8">
<style>
@font-face{font-family:O7;src:url(../../fontlar-gecici/Oswald-700.ttf)}
@font-face{font-family:M6;src:url(../../fontlar-gecici/Montserrat-600.ttf)}
@font-face{font-family:M8;src:url(../../fontlar-gecici/Montserrat-800.ttf)}
:root{--kirmizi:#E30A17;--turuncu:#FF6B1A;--amber:#FFB321;--sari:#FFD84D;--bordo:#A50E1C;--koyu:#6E0812}
html,body{margin:0;width:1080px;height:1350px;overflow:hidden}
/* sıcak, aydınlık zemin: krem-şeftali */
body{position:relative;background:linear-gradient(170deg,#FFF8EE 0%,#FFEBD8 55%,#FFDCC2 100%)}
/* gün batımı hissi veren bulanık sıcak lekeler */
.leke{position:absolute;border-radius:50%;filter:blur(60px)}
.l1{left:-120px;top:300px;width:420px;height:420px;background:var(--kirmizi);opacity:.55}
.l2{right:-140px;top:250px;width:460px;height:460px;background:var(--turuncu);opacity:.6}
.l3{left:390px;top:170px;width:300px;height:300px;background:var(--amber);opacity:.55}
.l4{left:140px;top:110px;width:180px;height:180px;background:var(--turuncu);opacity:.35}
.l5{right:120px;top:120px;width:160px;height:160px;background:var(--kirmizi);opacity:.3}
/* enerjik çapraz şeritler */
.serit{position:absolute;left:-200px;right:-200px;height:26px;transform:rotate(-12deg);opacity:.16;background:#fff}
.s1{top:520px}.s2{top:575px;height:12px}
.logo{position:absolute;left:50%;top:34px;width:190px;transform:translateX(-50%)}
.kisiler{position:absolute;left:0;top:0;width:1080px;height:1350px}
/* alt panel: sıcak kırmızıdan bordoya */
.panel{position:absolute;left:0;right:0;bottom:0;height:640px;
  background:linear-gradient(to bottom,rgba(200,14,28,0) 0%,rgba(200,14,28,.55) 20%,rgba(196,14,28,.93) 38%,#C40E1C 48%,var(--bordo) 78%,var(--koyu) 100%)}
.panel::after{content:"";position:absolute;inset:0;background:radial-gradient(ellipse 60% 40% at 50% 62%,rgba(255,120,40,.35),transparent 70%)}
.etiket{position:absolute;right:56px;top:868px;padding-right:16px;border-right:5px solid var(--sari);color:#fff;text-align:right}
.etiket b{display:block;font:40px/1 O7;letter-spacing:.02em}
.etiket span{display:block;margin-top:7px;font:19px/1 M6;letter-spacing:.04em;color:#FFE6D6}
.slogan{position:absolute;left:0;right:0;top:960px;text-align:center;color:#fff}
.s-1{font:98px/1 O7;letter-spacing:.01em;text-shadow:0 4px 18px rgba(80,0,8,.35)}
.s-2{display:inline-block;margin-top:14px;padding:8px 26px 12px;font:58px/1 O7;letter-spacing:.01em;color:var(--koyu);background:var(--sari);transform:rotate(-2deg);box-shadow:0 8px 22px rgba(80,0,8,.3)}
.imza{position:absolute;left:0;right:0;bottom:40px;display:flex;justify-content:center;align-items:center;gap:30px}
.imza .gl{height:112px}
.imza .ayrac{width:2px;height:128px;background:rgba(255,255,255,.6)}
.imza .isim{height:132px}
</style>
<body>
<div class="leke l1"></div><div class="leke l2"></div><div class="leke l3"></div><div class="leke l4"></div><div class="leke l5"></div>
<div class="serit s1"></div><div class="serit s2"></div>
<img class="logo" src="yp-logo-renkli.png">
<img class="kisiler" src="kisiler.png">
<div class="panel"></div>
<div class="etiket"><b>DİLAVER DEMİR</b><span>Yeni Parti Aydın İl Başkan Adayı</span></div>
<div class="slogan"><div class="s-1">SÖZ GENÇLERİN,</div><div class="s-2">DESTEĞİM DİLAVER DEMİR'E</div></div>
<div class="imza"><img class="gl" src="yeni-genclik-beyaz.png"><span class="ayrac"></span><img class="isim" src="imza-isim.png"></div>
</body></html>
