<!doctype html><html lang="tr"><meta charset="utf-8">
<style>
@font-face{font-family:O7;src:url(../../fontlar-gecici/Oswald-700.ttf)}
@font-face{font-family:M6;src:url(../../fontlar-gecici/Montserrat-600.ttf)}
:root{--kirmizi:#C4161C;--murekkep:#2A2624;--bej:#E6E0D6}
html,body{margin:0;width:1080px;height:1350px;overflow:hidden}
body{position:relative;background:radial-gradient(ellipse 80% 70% at 50% 40%,#EEE9E0 0%,#E4DDD2 60%,#D6CDBF 100%)}
.doku{position:absolute;inset:0;opacity:.5;mix-blend-mode:multiply}
.lekeler{position:absolute;inset:0;opacity:.35;mix-blend-mode:multiply}
.logo{position:absolute;left:50%;top:34px;width:180px;transform:translateX(-50%)}
.kisiler{position:absolute;left:0;top:0;width:1080px;height:1350px}
.zemin-golge{position:absolute;left:60px;right:60px;top:900px;height:120px;border-radius:50%;
  background:radial-gradient(ellipse at center,rgba(60,45,35,.28),transparent 70%)}
.etiket{position:absolute;right:56px;top:880px;padding-right:16px;border-right:5px solid var(--kirmizi);color:var(--murekkep);text-align:right}
.etiket b{display:block;font:40px/1 O7;letter-spacing:.02em}
.etiket span{display:block;margin-top:7px;font:19px/1 M6;letter-spacing:.04em;color:#5A524C}
.slogan{position:absolute;left:0;right:0;top:972px;text-align:center}
.s-1{font:100px/1 O7;letter-spacing:.01em;color:var(--murekkep)}
.s-2{margin-top:10px;font:66px/1 O7;letter-spacing:.01em;color:var(--kirmizi)}
.imza{position:absolute;left:0;right:0;bottom:42px;display:flex;justify-content:center;align-items:center;gap:30px}
.imza .gl{height:104px}
.imza .ayrac{width:2px;height:120px;background:rgba(42,38,36,.45)}
.imza .isim{height:124px}
</style>
<body>
<svg class="doku" width="1080" height="1350"><filter id="n"><feTurbulence type="fractalNoise" baseFrequency=".9" numOctaves="3" seed="4"/><feColorMatrix type="matrix" values="0 0 0 0 .55  0 0 0 0 .48  0 0 0 0 .40  0 0 0 .55 0"/></filter><rect width="1080" height="1350" filter="url(#n)"/></svg>
<svg class="lekeler" width="1080" height="1350"><filter id="m"><feTurbulence type="fractalNoise" baseFrequency=".006" numOctaves="4" seed="9"/><feColorMatrix type="matrix" values="0 0 0 0 .62  0 0 0 0 .55  0 0 0 0 .45  0 0 0 1.3 -.55"/></filter><rect width="1080" height="1350" filter="url(#m)"/></svg>
<img class="logo" src="yp-logo-renkli.png">
<div class="zemin-golge"></div>
<img class="kisiler" src="kisiler.png">
<div class="etiket"><b>DİLAVER DEMİR</b><span>Yeni Parti Aydın İl Başkan Adayı</span></div>
<div class="slogan"><div class="s-1">SÖZ GENÇLERİN,</div><div class="s-2">DESTEĞİM DİLAVER DEMİR'E</div></div>
<div class="imza"><img class="gl" src="yeni-genclik-kirmizi.png"><span class="ayrac"></span><img class="isim" src="imza-isim-koyu.png"></div>
</body></html>
