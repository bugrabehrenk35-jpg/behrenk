<!doctype html><html lang="tr"><meta charset="utf-8"><style>
@font-face{font-family:O7;src:url(../../fontlar-gecici/Oswald-700.ttf)}
@font-face{font-family:O5;src:url(../../fontlar-gecici/Oswald-500.ttf)}
@font-face{font-family:O3;src:url(../../fontlar-gecici/Oswald-300.ttf)}
@font-face{font-family:PI;src:url(../../fontlar-gecici/PlayfairDisplay-500i.ttf)}
@font-face{font-family:Imza;src:url(../../fontlar-gecici/Yellowtail.ttf)}
:root{--zemin:#0E0E0E;--acik:#F1EDE6;--gri:#9A948C;--kir:#E30A17}
html,body{margin:0;width:1080px;height:1350px;overflow:hidden;background:var(--zemin)}
.foto{position:absolute;left:170px;top:-6px;width:1010px;-webkit-mask:linear-gradient(90deg,transparent 0%,#000 30%)}
.koyu{position:absolute;inset:0;background:
 linear-gradient(90deg,rgba(14,14,14,.97) 0%,rgba(14,14,14,.9) 22%,rgba(14,14,14,.35) 42%,rgba(14,14,14,0) 58%),
 linear-gradient(180deg,rgba(14,14,14,.55) 0%,rgba(14,14,14,0) 22%,rgba(14,14,14,0) 60%,rgba(14,14,14,.88) 74%,#0E0E0E 86%)}
.gren{position:absolute;inset:0;opacity:.16;mix-blend-mode:overlay}
.sol{position:absolute;left:68px;top:92px}
.ust{font:21px/1 O5;letter-spacing:.4em;color:var(--gri)}
.cz{width:60px;height:3px;background:var(--kir);margin:26px 0 30px}
.gun{font:220px/.82 O7;color:var(--acik);letter-spacing:-.01em}
.ay{font:104px/1 O7;color:var(--acik);letter-spacing:.02em;margin-top:14px}
.yil{margin-top:26px;font:40px/1 O3;color:var(--acik);letter-spacing:.12em}
.yil b{font:40px/1 O5;color:var(--kir);font-weight:normal;margin-left:16px}
.soz{position:absolute;left:68px;right:68px;top:992px;font:50px/1.26 PI;color:var(--acik)}
.soz small{display:block;margin-top:16px;font:20px/1 O5;letter-spacing:.34em;color:var(--gri);font-style:normal}
.imza{position:absolute;left:0;right:0;bottom:52px;display:flex;justify-content:center;align-items:center;gap:28px}
.imza img{height:78px}.imza .ayrac{width:3px;height:84px;background:var(--kir)}
.imza .ad{font:74px/1 Imza;color:var(--acik);white-space:nowrap;transform:translateY(2px)}
</style><body>
<img class="foto" src="ataturk-hd.jpg">
<div class="koyu"></div>
<svg class="gren" width="1080" height="1350"><filter id="g"><feTurbulence type="fractalNoise" baseFrequency=".85" numOctaves="2" seed="7"/><feColorMatrix type="saturate" values="0"/></filter><rect width="1080" height="1350" filter="url(#g)"/></svg>
<div class="sol">
 <div class="ust">SAYGIYLA ANIYORUZ</div>
 <div class="cz"></div>
 <div class="gun">10</div>
 <div class="ay">KASIM</div>
 <div class="yil">1938<b>09.05</b></div>
</div>
<div class="soz">“Beni görmek demek, mutlaka yüzümü görmek demek değildir.”<small>MUSTAFA KEMAL ATATÜRK</small></div>
<div class="imza"><img src="yeni-parti-beyaz.png"><span class="ayrac"></span><span class="ad">Erkan Karakış</span></div>
</body></html>
