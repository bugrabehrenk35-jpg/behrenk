<!doctype html><html lang="tr"><meta charset="utf-8">
<style>
@font-face{font-family:Afis;src:url(../fontlar-gecici/Oswald-700.ttf)}
@font-face{font-family:AfisO;src:url(../fontlar-gecici/Oswald-500.ttf)}
@font-face{font-family:Imza;src:url(../fontlar-gecici/GreatVibes.ttf)}
:root{--kirmizi:#E30A17;--gece:#09090B;--krem:#F2EFEA}
html,body{margin:0;width:1080px;height:1329px;overflow:hidden}
body{position:relative;background:var(--gece);color:var(--krem)}
/* karlı ekran parazit dokusu, üstte yoğun, aşağı doğru kaybolan */
.parazit{position:absolute;left:0;right:0;top:0;height:780px;opacity:.34;
  -webkit-mask:linear-gradient(to bottom,#000 0 45%,transparent 100%)}
.isik{position:absolute;left:50%;top:360px;width:900px;height:640px;transform:translate(-50%,-50%);
  background:radial-gradient(ellipse at center,rgba(227,10,23,.35),transparent 65%)}
.cerceve{position:absolute;left:50%;top:150px;width:340px;height:330px;transform:translateX(-50%);
  border-radius:22px;overflow:hidden;box-shadow:0 0 0 10px #000,0 0 0 13px rgba(227,10,23,.9),0 40px 80px rgba(0,0,0,.7)}
.cerceve img{width:100%;height:100%;display:block}
.canli{position:absolute;left:50%;top:520px;transform:translateX(-50%);display:flex;align-items:center;gap:14px;
  background:var(--kirmizi);color:#fff;font:32px/1 Afis;letter-spacing:.2em;padding:14px 26px 14px 30px;border-radius:40px;white-space:nowrap}
.canli i{width:16px;height:16px;border-radius:50%;background:#fff}
.baslik{position:absolute;left:0;right:0;top:632px;text-align:center}
.b1{font:152px/1 Afis;letter-spacing:-.01em}
.b1 em{font-style:normal;color:var(--kirmizi)}
.b2{font:134px/1.04 Afis;letter-spacing:.01em}
.cizgi{position:absolute;left:50%;top:982px;width:180px;height:8px;margin-left:-90px;background:var(--kirmizi)}

/* imza bloğu */
.imza{position:absolute;left:50%;bottom:118px;transform:translateX(-50%);display:flex;align-items:center;gap:30px}
.imza img{height:96px;display:block}
.imza .ayrac{width:2px;height:104px;background:rgba(242,239,234,.55)}
.imza .ad{font:84px/1 Imza;color:#fff;white-space:nowrap;transform:translateY(4px)}
</style>
<body>
<svg class="parazit" width="1080" height="780"><filter id="n"><feTurbulence type="fractalNoise" baseFrequency="1.1" numOctaves="2" seed="7"/><feColorMatrix type="saturate" values="0"/></filter><rect width="1080" height="780" filter="url(#n)"/></svg>
<div class="isik"></div>
<div class="cerceve"><img src="../halktv-susturulamaz/halktv-kare.png"></div>
<div class="canli"><i></i>CANLI YAYIN SÜRÜYOR</div>
<div class="baslik">
  <div class="b1">#<em>HALKTV</em></div>
  <div class="b2">SUSTURULAMAZ</div>
</div>
<div class="cizgi"></div>
<div class="imza"><img src="yeni-parti-beyaz.png"><span class="ayrac"></span><span class="ad">Erkan Karakış</span></div>
</body></html>
