<!doctype html><html lang="tr"><meta charset="utf-8">
<style>
@font-face{font-family:O7;src:url(../../fontlar-gecici/Oswald-700.ttf)}
@font-face{font-family:O5;src:url(../../fontlar-gecici/Oswald-500.ttf)}
@font-face{font-family:PF;src:url(../../fontlar-gecici/PlayfairDisplay-800.ttf)}
@font-face{font-family:PI;src:url(../../fontlar-gecici/PlayfairDisplay-500i.ttf)}
@font-face{font-family:Imza;src:url(../../fontlar-gecici/Yellowtail.ttf)}
:root{--kagit:#F1ECE2;--murekkep:#1C1A18;--kirmizi:#E30A17;--gri:#8C857B}
html,body{margin:0;width:1080px;height:1350px;overflow:hidden}
body{position:relative;background:radial-gradient(ellipse 90% 70% at 50% 40%,#F6F2EA 0%,var(--kagit) 60%,#E4DDCF 100%);color:var(--murekkep)}
.doku{position:absolute;inset:0;opacity:.5;mix-blend-mode:multiply}
.kat{position:absolute;left:0;right:0;top:675px;height:2px;background:linear-gradient(90deg,transparent,rgba(0,0,0,.07) 20%,rgba(0,0,0,.07) 80%,transparent);box-shadow:0 1px 0 rgba(255,255,255,.6)}
.sayfa{position:absolute;left:72px;right:72px;top:90px}
.ust{display:flex;justify-content:space-between;font:24px/1 O5;letter-spacing:.14em;color:var(--gri);padding-bottom:16px;border-bottom:2px solid var(--murekkep)}
.manset{text-align:center;font:112px/1 PF;letter-spacing:-.01em;padding:26px 0 20px;white-space:nowrap}
.alt-ust{display:flex;justify-content:space-between;font:24px/1 O5;letter-spacing:.14em;padding:14px 0;border-top:6px double var(--murekkep);border-bottom:2px solid var(--murekkep)}
.alt-ust b{font-weight:normal;color:var(--kirmizi)}
.baslik{margin-top:52px;font:118px/1.06 O7;white-space:nowrap;letter-spacing:-.005em;text-transform:uppercase}
.baslik em{font-style:normal;color:var(--kirmizi)}
.spot{margin-top:34px;font:38px/1.34 PI;max-width:900px}
.sutunlar{margin-top:40px;display:grid;grid-template-columns:repeat(3,1fr);gap:34px;height:120px;overflow:hidden;
  -webkit-mask:linear-gradient(to bottom,#000 30%,transparent)}
.sutun{background:repeating-linear-gradient(180deg,rgba(28,26,24,.20) 0 7px,transparent 7px 19px)}
.sutun:nth-child(2){background:repeating-linear-gradient(180deg,rgba(28,26,24,.20) 0 7px,transparent 7px 19px) 0 0/88% 100% no-repeat}
.imza{position:absolute;left:0;right:0;bottom:92px;display:flex;justify-content:center;align-items:center;gap:30px}
.imza img{height:96px}.imza .ayrac{width:3px;height:104px;background:var(--kirmizi)}
.imza .ad{font:90px/1 Imza;color:var(--murekkep);white-space:nowrap;transform:translateY(2px)}
</style>
<body>
<svg class="doku" width="1080" height="1350"><filter id="n"><feTurbulence type="fractalNoise" baseFrequency=".75" numOctaves="3" seed="9"/><feColorMatrix type="matrix" values="0 0 0 0 .55  0 0 0 0 .5  0 0 0 0 .44  0 0 0 .45 0"/></filter><rect width="1080" height="1350" filter="url(#n)"/></svg>
<div class="kat"></div>
<div class="sayfa">
  <div class="ust"><span>21 EKİM 2026</span><span>ÇARŞAMBA</span></div>
  <div class="manset">Gazeteciler Günü</div>
  <div class="alt-ust"><span>TERCÜMAN-I AHVAL'DEN BU YANA</span><b>ÖZEL SAYI</b></div>
  <div class="baslik">Gerçeği yazan<br><em>her kalemin</em><br>günü kutlu olsun</div>
  <div class="spot">Halkın haber alma hakkı için sahada, masada, ekranda emek veren tüm basın mensuplarımızın gününü kutluyoruz.</div>
  <div class="sutunlar"><div class="sutun"></div><div class="sutun"></div><div class="sutun"></div></div>
</div>
<div class="imza"><img src="yp-logo-renkli.png"><span class="ayrac"></span><span class="ad">Erkan Karakış</span></div>
</body></html>
<script>document.fonts.ready.then(()=>{const b=document.querySelector('.baslik');const r=b.scrollWidth;if(r>936){b.style.fontSize=(118*936/r)+'px'}})</script>
