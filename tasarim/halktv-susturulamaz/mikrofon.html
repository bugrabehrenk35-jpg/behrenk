<!doctype html><html lang="tr"><meta charset="utf-8">
<style>
@font-face{font-family:Afis;src:url(../fontlar-gecici/Oswald-700.ttf)}
@font-face{font-family:Govde;src:url(../fontlar-gecici/RobotoCondensed-400.ttf);font-weight:400}
@font-face{font-family:Govde;src:url(../fontlar-gecici/RobotoCondensed-700.ttf);font-weight:700}
@font-face{font-family:Sehir;src:url(../fontlar-gecici/Montserrat-800.ttf)}
:root{--kirmizi:#E30A17;--koyu:#141416;--kagit:#F4F2EE}
html,body{margin:0;width:1080px;height:1329px;overflow:hidden}
body{position:relative;background:var(--kagit);color:var(--koyu);font-family:Govde,sans-serif}
.halka{position:absolute;left:50%;top:430px;transform:translate(-50%,-50%);border-radius:50%;border:3px solid rgba(227,10,23,.18)}
.mik{position:absolute;left:50%;top:70px;width:520px;transform:translateX(-50%)}
.bant{position:absolute;left:50%;top:330px;width:600px;height:104px;transform:translateX(-50%) rotate(-8deg);
  background:var(--kirmizi);color:#fff!important;box-shadow:0 10px 24px rgba(0,0,0,.25);display:flex;align-items:center;justify-content:center;
  font:62px/1 Afis;letter-spacing:.18em;padding-left:.18em;
  clip-path:polygon(0 6%,4% 0,100% 0,96% 100%,92% 92%,0 100%)}
.bant s{text-decoration:none;position:relative}
.bant s::after{content:"";position:absolute;left:-6%;right:-6%;top:50%;height:10px;background:#141416;transform:rotate(-4deg)}
.yirtik{position:absolute;left:calc(50% + 250px);top:300px;width:120px;height:110px;background:var(--koyu);
  transform:rotate(28deg);clip-path:polygon(0 30%,100% 0,85% 100%,10% 80%)}
.baslik{position:absolute;left:0;right:0;top:760px;text-align:center}
.b1{font:150px/1 Afis;letter-spacing:-.01em}
.b1 em{font-style:normal;color:var(--kirmizi)}
.b2{display:inline-block;margin-top:8px;background:var(--kirmizi);color:#fff;font:118px/1 Afis;padding:6px 30px 14px}
.alt{position:absolute;left:0;right:0;top:1090px;text-align:center;font:400 36px/1.3 Govde;color:#55555B}
.alt b{color:var(--koyu);font-weight:700}
.logo-kutu{position:absolute;left:50%;bottom:70px;transform:translateX(-50%)}
.logo{position:relative;width:835px;height:705px;zoom:.15}
.logo img{position:absolute;left:0;top:0}
.logo .sehir{position:absolute;left:0;width:852px;text-align:center;top:613px;font:800 119px/1 Sehir;color:#DD0004}
</style>
<body>
<div class="halka" style="width:640px;height:640px"></div>
<div class="halka" style="width:820px;height:820px;opacity:.6"></div>
<svg class="mik" viewBox="0 0 260 340">
  <rect x="70" y="10" width="120" height="200" rx="60" fill="#141416"/>
  <g stroke="#3a3a40" stroke-width="5" stroke-linecap="round">
    <line x1="92" y1="60" x2="168" y2="60"/><line x1="86" y1="85" x2="174" y2="85"/><line x1="84" y1="110" x2="176" y2="110"/>
  </g>
  <path d="M40 150 v20 a90 90 0 0 0 180 0 v-20" fill="none" stroke="#141416" stroke-width="16" stroke-linecap="round"/>
  <rect x="122" y="258" width="16" height="50" fill="#141416"/>
  <rect x="70" y="300" width="120" height="18" rx="9" fill="#E30A17"/>
</svg>
<div class="bant"><s>SANSÜR</s></div>

<div class="baslik">
  <div class="b1">#<em>HALKTV</em></div>
  <div class="b2">SUSTURULAMAZ</div>
</div>
<div class="alt">Sesi kısılan her ekranda <b>gençliğin sesi yükselecek!</b></div>
<div class="logo-kutu"><div class="logo"><img src="../varliklar/yeni-genclik-kirmizi.png"><div class="sehir">DİDİM</div></div></div>
</body></html>
