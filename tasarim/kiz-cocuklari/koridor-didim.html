<!doctype html><html lang="tr"><meta charset="utf-8">
<style>
@font-face{font-family:Afis;src:url(../fontlar-gecici/Oswald-700.ttf)}
@font-face{font-family:AfisO;src:url(../fontlar-gecici/Oswald-500.ttf)}
@font-face{font-family:BaslikI;src:url(../fontlar-gecici/PlayfairDisplay-500i.ttf)}
@font-face{font-family:El;src:url(../fontlar-gecici/GreatVibes.ttf)}
@font-face{font-family:Kucuk;src:url(../fontlar-gecici/Montserrat-700.ttf)}
@font-face{font-family:Sehir;src:url(../fontlar-gecici/Montserrat-800.ttf)}

/* fotoğrafın kendi sepya tonları */
:root{--krem:#F7EBDA;--kahve:#2A1A10;--altin:#E7B66B;--kiremit:#D9483B}
html,body{margin:0;width:1080px;height:1329px;overflow:hidden;background:var(--kahve)}
body{position:relative;color:var(--krem)}
.foto{position:absolute;left:0;top:-214px;width:1080px}
/* güneş ışığı ve alttan sıcak karartma */
.isik{position:absolute;inset:0;
  background:
    radial-gradient(ellipse 60% 45% at 18% 10%,rgba(255,236,200,.35),transparent 70%),
    linear-gradient(to bottom,rgba(42,26,16,0) 40%,rgba(42,26,16,.5) 56%,rgba(42,26,16,.78) 68%,rgba(42,26,16,.9) 84%,rgba(42,26,16,.97) 100%)}

/* koşan kızın yolunu izleyen kesik çizgi */
.yol{position:absolute;inset:0}

.ust{position:absolute;left:64px;top:64px;font:700 22px/1 Kucuk;letter-spacing:.42em;color:var(--kahve);
  background:var(--krem);padding:14px 18px 14px 22px;border-radius:4px}

.metin{position:absolute;left:0;right:0;top:868px;text-align:center}
.metin .davet{font:700 22px/1 Kucuk;letter-spacing:.34em;padding-left:.34em;color:var(--altin)}
.metin .b1{margin-top:24px;font:72px/1 AfisO;letter-spacing:.06em;padding-left:.06em}
.metin .b2{margin-top:14px;font:118px/1 Afis;letter-spacing:.005em;color:var(--kiremit)}
.metin .b3{margin-top:20px;display:inline-flex;align-items:center;gap:20px;font:38px/1 AfisO;letter-spacing:.22em;padding-left:.22em}
.metin .b3 i{width:56px;height:3px;background:var(--altin)}

.logo-kutu{position:absolute;left:50%;bottom:28px;transform:translateX(-50%)}
.logo{position:relative;width:835px;height:705px;zoom:.12}
.logo img{position:absolute;left:0;top:0}
.logo .sehir{position:absolute;left:0;width:852px;text-align:center;top:613px;font:800 119px/1 Sehir;color:#fff}
</style>
<body>
<img class="foto" src="koridor.jpg">
<div class="isik"></div>




<div class="metin">
  <div class="davet">GELECEĞE KOŞAN BÜTÜN KIZLARIMIZIN</div>
  <div class="b1">DÜNYA</div>
  <div class="b2">KIZ ÇOCUKLARI</div>
  <div class="b3"><i></i>GÜNÜ KUTLU OLSUN<i></i></div>
</div>

<div class="logo-kutu"><div class="logo"><img src="../varliklar/yeni-genclik-beyaz.png"><div class="sehir">DİDİM</div></div></div>
</body></html>
