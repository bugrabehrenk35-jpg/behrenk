<!doctype html><html lang="tr"><meta charset="utf-8">
<style>
@font-face{font-family:Baslik;src:url(../fontlar-gecici/PlayfairDisplay-800.ttf)}
@font-face{font-family:BaslikI;src:url(../fontlar-gecici/PlayfairDisplay-500i.ttf)}
@font-face{font-family:El;src:url(../fontlar-gecici/GreatVibes.ttf)}
@font-face{font-family:Kucuk;src:url(../fontlar-gecici/Montserrat-700.ttf)}

/* fotoğraftaki karanfil pembesi ve elbise kırmızısı */
:root{--pudra:#FDF0F2;--bordo:#8E1530;--karanfil:#E0457B;--gul:#F7C6D3}
html,body{margin:0;width:1080px;height:1440px;overflow:hidden;background:var(--pudra)}
body{position:relative;color:var(--bordo)}
.foto{position:absolute;left:0;top:-96px;width:1080px;
  -webkit-mask:linear-gradient(to bottom,#000 0 64%,rgba(0,0,0,.55) 71%,transparent 78%)}
.pembe-isik{position:absolute;inset:0;
  background:radial-gradient(ellipse 70% 30% at 50% 78%,rgba(247,198,211,.55),transparent 70%)}

.etiket{position:absolute;right:56px;top:56px;background:var(--bordo);color:#fff;
  font:700 22px/1 Kucuk;letter-spacing:.42em;padding:15px 16px 15px 24px;border-radius:40px}


.metin{position:absolute;left:0;right:0;top:1018px;text-align:center}
.metin .ince{font:30px/1.3 BaslikI;color:var(--karanfil)}
.metin .b1{margin-top:18px;font:800 84px/1 Baslik;letter-spacing:-.012em}
.metin .b1 em{font-style:normal;color:var(--karanfil)}
.metin .b2{font:800 84px/1.04 Baslik;letter-spacing:-.012em;display:inline-block}
.metin .el{display:inline-block;margin-left:22px;font:84px/1 El;color:var(--karanfil);transform:rotate(-5deg) translateY(6px)}

.imza{position:absolute;left:50%;bottom:48px;width:270px;transform:translateX(-50%)}
</style>
<body>
<img class="foto" src="karanfil.jpg">
<div class="pembe-isik"></div>



<div class="metin">
  <div class="ince">Karanfiller gibi açsın bütün kız çocuklarımız</div>
  <div class="b1">Dünya <em>Kız Çocukları</em></div>
  <div class="b2">Günü</div><span class="el">kutlu olsun</span>
</div>

<img class="imza" src="../kisisel/imza-orijinal.png">
</body></html>
