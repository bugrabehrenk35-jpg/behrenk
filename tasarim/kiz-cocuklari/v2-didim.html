<!doctype html><html lang="tr"><meta charset="utf-8">
<style>
@font-face{font-family:Baslik;src:url(../fontlar-gecici/PlayfairDisplay-800.ttf);font-weight:800}
@font-face{font-family:BaslikI;src:url(../fontlar-gecici/PlayfairDisplay-500i.ttf)}
@font-face{font-family:El;src:url(../fontlar-gecici/GreatVibes.ttf)}
@font-face{font-family:Soz;src:url(../fontlar-gecici/CormorantGaramond-600i.ttf)}
@font-face{font-family:Sehir;src:url(../fontlar-gecici/Montserrat-800.ttf);font-weight:800}
@font-face{font-family:Kucuk;src:url(../fontlar-gecici/Montserrat-700.ttf);font-weight:700}

/* lila – şeftali – mercan */
:root{--erik:#3A1B4D;--mercan:#F2545B;--gunes:#FFB547;--lila:#E9E1FF;--seftali:#FFE4D6}
html,body{margin:0;width:1080px;height:1440px;overflow:hidden}
body{position:relative;color:var(--erik);font-family:Baslik,serif;
  background:
    radial-gradient(circle at 82% 14%,rgba(255,181,71,.38) 0 120px,transparent 330px),
    linear-gradient(165deg,var(--lila) 0%,#F6EEFF 38%,var(--seftali) 100%)}

/* süs: kâğıt uçaklar, yıldızlar, yay */
.sus{position:absolute;inset:0;pointer-events:none}

/* polaroid */
.polaroid{position:absolute;left:192px;top:118px;width:696px;padding:26px 26px 92px;background:#fff;
  transform:rotate(-3.5deg);box-shadow:0 30px 60px rgba(58,27,77,.22),0 4px 10px rgba(58,27,77,.08)}
.polaroid .foto{width:696px;height:520px;overflow:hidden;background:var(--erik)}
.polaroid .foto img{width:100%;height:100%;object-fit:cover;object-position:50% 70%;filter:url(#duo)}
.polaroid .not{position:absolute;left:0;right:0;bottom:22px;text-align:center;font:52px/1 El;color:var(--erik)}
.bant{position:absolute;width:170px;height:46px;background:rgba(255,181,71,.72);top:-18px}
.bant.s{left:-34px;transform:rotate(-38deg)} .bant.r{right:-34px;transform:rotate(36deg);background:rgba(242,84,91,.6)}

.tarih{position:absolute;left:0;right:0;top:880px;text-align:center;font:700 22px/1 Kucuk;letter-spacing:.5em;padding-left:.5em;color:var(--mercan)}
.baslik{position:absolute;left:0;right:0;top:918px;text-align:center}
.baslik .a{font:800 74px/1 Baslik;letter-spacing:-.01em}
.baslik .b{font:800 112px/1 Baslik;letter-spacing:-.015em;color:var(--mercan);margin-top:4px}
.baslik .c{font:800 74px/1 Baslik;letter-spacing:-.01em;margin-top:2px}
.baslik .c i{font:68px/1 BaslikI;font-style:normal}

.soz{position:absolute;left:150px;right:150px;top:1222px;text-align:center;font:34px/1.25 Soz;color:var(--erik)}
.soz small{display:block;margin-top:8px;font:700 15px/1 Kucuk;letter-spacing:.36em;padding-left:.36em;color:rgba(58,27,77,.6)}

.alt-imza{position:absolute;left:50%;bottom:var(--imza-alt,36px);transform:translateX(-50%)}
.logo{position:relative;width:835px;height:705px;zoom:var(--logo-zoom,.135)}
.logo img{position:absolute;left:0;top:0}
.logo .sehir{position:absolute;left:0;width:852px;text-align:center;top:613px;font:800 119px/1 Sehir;color:#DD0004}
.imza{display:block;width:300px}
</style>
<body>
<svg width="0" height="0" style="position:absolute">
  <filter id="duo" color-interpolation-filters="sRGB">
    <feColorMatrix type="saturate" values="0"/>
    <feComponentTransfer>
      <feFuncR type="table" tableValues="0.20 0.98 1"/>
      <feFuncG type="table" tableValues="0.09 0.80 0.97"/>
      <feFuncB type="table" tableValues="0.28 0.78 0.93"/>
    </feComponentTransfer>
  </filter>
</svg>

<svg class="sus" viewBox="0 0 1080 1440">
  <!-- kesik çizgili uçuş yolu + kâğıt uçak -->
  <path d="M60 880 C 120 760, 40 640, 150 560 S 120 330, 210 250" fill="none" stroke="#F2545B" stroke-width="3" stroke-dasharray="2 14" stroke-linecap="round" opacity=".8"/>
  <g transform="translate(212 242) rotate(-62)">
    <path d="M0 0 L46 -14 L18 8 Z" fill="#F2545B"/><path d="M18 8 L46 -14 L22 20 Z" fill="#C93A44"/>
  </g>
  <path d="M1030 300 C 960 420, 1050 520, 970 640" fill="none" stroke="#3A1B4D" stroke-width="3" stroke-dasharray="2 14" stroke-linecap="round" opacity=".35"/>
  <g fill="#FFB547">
    <path d="M960 760 l8 20 20 8 -20 8 -8 20 -8 -20 -20 -8 20 -8z"/>
    <path d="M118 140 l6 15 15 6 -15 6 -6 15 -6 -15 -15 -6 15 -6z"/>
  </g>
  <g fill="#F2545B" opacity=".8">
    <path d="M1000 880 l5 12 12 5 -12 5 -5 12 -5 -12 -12 -5 12 -5z"/>
    <circle cx="96" cy="1010" r="7"/><circle cx="985" cy="1110" r="5"/>
  </g>
  <circle cx="70" cy="420" r="10" fill="none" stroke="#3A1B4D" stroke-width="3" opacity=".35"/>
</svg>

<div class="polaroid">
  <span class="bant s"></span><span class="bant r"></span>
  <div class="foto"><img src="ataturk-ulku.png"></div>
  <div class="not">Atatürk ve Ülkü</div>
</div>

<div class="tarih">11 EKİM</div>
<div class="baslik">
  <div class="a">Dünya</div>
  <div class="b">Kız Çocukları</div>
  <div class="c">Günü <i>kutlu olsun</i></div>
</div>

<div class="soz">“Dünyada her şey kadının eseridir.”<small>MUSTAFA KEMAL ATATÜRK</small></div>

<div class="alt-imza"><div class="logo"><img src="../varliklar/yeni-genclik-kirmizi.png"><div class="sehir">DİDİM</div></div></div>
</body></html>
